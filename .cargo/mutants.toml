# Kani proof modules compile only under cfg(kani), and Apple-native code does
# not compile on the Linux mutation host. Their dedicated Kani and Apple
# Silicon mutation gates provide the executable evidence instead.
exclude_globs = [
    "crates/*/src/proofs.rs",
    "tools/*/src/proofs.rs",
    "crates/alpine-metal/src/native.rs",
    "crates/alpine-metal/src/platform_spi.rs",
    "crates/alpine-platform-macos/src/native.rs",
]

# These functions are absent or intentionally effect-free in the Linux dynamic
# test build even though cargo-mutants parses them. The target-only drawable
# SPI, submission path, native bypass, and safe surface wrapper are exercised
# by the dedicated Apple Silicon mutation gate.
# The process-main-thread validation entry point is test orchestration; its
# shipping cleanup path and oracle support remain mutated on Apple Silicon.
# The symbolic adapter is exercised by the full Kani inventory and delegates
# directly to the dynamically tested transition.
exclude_re = [
    "initialize_for_native_validation",
    "MetalBackend::render_callback_drawable",
    "record_drawable_attempt",
    "verify_drawable_attempt_lifecycle",
    "complete_drawable_attempt",
    "native_validation::new_surface",
    "native_validation::run_until_frame_terminal",
    "native_validation::validate_initialization_rollback",
    "record_symbolic",
    "NativeSurface::show",
]
