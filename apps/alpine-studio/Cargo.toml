[package]
name = "alpine-studio"
version.workspace = true
description = "First shipping Alpine Studio application"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true

[dependencies]
alpine-core = { path = "../../crates/alpine-core", version = "=0.0.0" }
alpine-platform-macos = { path = "../../crates/alpine-platform-macos", version = "=0.0.0" }
alpine-runtime = { path = "../../crates/alpine-runtime", version = "=0.0.0" }
alpine-scene = { path = "../../crates/alpine-scene", version = "=0.0.0" }
alpine-text = { path = "../../crates/alpine-text", version = "=0.0.0" }
alpine-text-layout = { path = "../../crates/alpine-text-layout", version = "=0.0.0" }

[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(kani)', 'cfg(alpine_native_validation)'] }

[lints.clippy]
all = "deny"
pedantic = { level = "deny", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"

[[test]]
name = "native_process"
harness = false
