[workspace]
members = [
  "apps/alpine-studio",
  "crates/alpine-core",
  "crates/alpine-metal",
  "crates/alpine-platform",
  "crates/alpine-platform-macos",
  "crates/alpine-renderer",
  "crates/alpine-runtime",
  "crates/alpine-scene",
  "crates/alpine-text",
  "crates/alpine-text-layout",
  "tools/alpine-assurance",
  "tools/alpine-trace",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.93.0"
publish = false
license-file = "LICENSE.md"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
all = "deny"
pedantic = { level = "deny", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"

[profile.dev]
debug = 1
incremental = true

[profile.release]
codegen-units = 1
debug = "limited"
lto = "thin"
panic = "abort"
