name: Weekly assurance

on:
  schedule:
    - cron: "41 9 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-assurance
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  mutation:
    name: mutation-full
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install mutation tools
        run: cargo install --locked cargo-mutants --version 27.1.0
      - name: Require all workspace mutants to be killed
        run: cargo mutants --workspace --no-shuffle --output target/mutants.out -- --locked
      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mutation-full-${{ github.sha }}
          path: target/mutants.out
          retention-days: 7
          if-no-files-found: warn

  coverage:
    name: coverage-full
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install coverage tools
        run: cargo install --locked cargo-llvm-cov --version 0.8.7
      - name: Install LLVM tools
        run: rustup component add llvm-tools-preview
      - name: Measure and enforce workspace coverage
        run: cargo llvm-cov --workspace --all-features --locked --html --output-dir target/coverage-html --fail-under-lines 85 --fail-under-functions 90
      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-full-${{ github.sha }}
          path: target/coverage-html
          retention-days: 7
          if-no-files-found: warn
