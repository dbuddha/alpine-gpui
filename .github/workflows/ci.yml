name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  policy:
    name: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Show toolchain
        run: rustc --version --verbose
      - name: Check repository policy
        env:
          ALPINE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ALPINE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-policy.sh
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all targets
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test all targets
        run: cargo test --workspace --all-targets --all-features --locked
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

  native:
    name: native-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
          - name: macos-arm64
            os: macos-26
          - name: windows-x64
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Show target
        run: rustc --version --verbose
      - name: Test workspace
        run: cargo test --workspace --all-targets --all-features --locked

  ci-pass:
    name: ci-pass
    if: always()
    needs: [policy, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful gates
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          test "$POLICY_RESULT" = success
          test "$NATIVE_RESULT" = success
