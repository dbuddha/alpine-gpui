name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Explicit comparison base commit for this dispatch
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  classify:
    name: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      base_sha: ${{ steps.classify.outputs.base_sha }}
      head_sha: ${{ steps.classify.outputs.head_sha }}
      code: ${{ steps.classify.outputs.code }}
      metal: ${{ steps.classify.outputs.metal }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: classify
        name: Select required evidence
        env:
          ALPINE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base_sha }}
          ALPINE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: scripts/classify-ci.sh

  preflight:
    name: preflight
    needs: classify
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Check technical repository policy
        run: scripts/check-policy.sh
      - name: Require cheap source feedback before assurance fan-out
        if: needs.classify.outputs.code == 'true'
        run: scripts/check-ci-fast-feedback.sh

  quality:
    name: quality
    needs: [classify, preflight]
    if: needs.classify.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install policy tools
        run: cargo install --locked cargo-deny --version 0.20.2
      - name: Show toolchain
        run: rustc --version --verbose
      - name: Check technical repository policy
        run: scripts/check-policy.sh
      - name: Test repository automation
        run: |
          scripts/test-policy.sh
          scripts/test-classifier.sh
          scripts/test-ci-admission.sh
          scripts/test-product-boundary.sh
          scripts/test-alpine-editor-app-bundle.sh
          scripts/test-ci-cache-selection.sh
          scripts/test-qualification.sh
          scripts/test-zed-lab-evidence.sh
          scripts/check-release.sh
          scripts/test-core-contracts.sh
          scripts/test-metal-contracts.sh
      - name: Check dependencies and licenses
        run: cargo deny check bans licenses sources advisories
      - name: Test all targets
        run: cargo test --workspace --all-targets --all-features --locked
      - name: Stress Studio concurrency admission
        run: scripts/test-studio-concurrency-stress.sh
      - name: Test Rust API examples
        run: cargo test --workspace --doc --all-features --locked
      - name: Build Rust API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked
      - name: Check evidence registry consistency
        run: scripts/test-assurance.sh
      - name: Upload rustdoc artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rustdoc-${{ github.sha }}
          path: target/doc
          retention-days: 7
          if-no-files-found: error

  native:
    name: native-macos-arm64
    needs: [classify, preflight]
    if: needs.classify.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Show target
        run: rustc --version --verbose
      - name: Verify native execution
        if: needs.classify.outputs.metal == 'true'
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
          MACOSX_DEPLOYMENT_TARGET: "15.0"
          ALPINE_VALIDATION_DEPLOYMENT_TARGET: "26.0"
          ALPINE_PRESENTATION_EVIDENCE_MODE: hosted-direct
          RUSTFLAGS: --cfg alpine_native_validation
        run: scripts/check-ci-native-admission.sh
      - name: Retain native execution output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-admission-${{ github.sha }}
          path: target/native-acceptance
          retention-days: 7
          if-no-files-found: warn
      - name: Audit Alpine Editor release product boundary
        shell: bash
        run: |
          mkdir -p target
          scripts/check-product-boundary.sh --binary | tee target/studio-product-boundary.txt
      - name: Upload Alpine Editor product-boundary evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: studio-product-boundary-${{ github.sha }}
          path: target/studio-product-boundary.txt
          retention-days: 7
          if-no-files-found: error

  metal-validation:
    name: metal-validation
    needs: [classify, preflight]
    if: needs.classify.outputs.metal == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      ALPINE_VALIDATION_DEPLOYMENT_TARGET: "26.0"
      # Hosted macOS runners may have no display that Core Animation can
      # qualify. Validation and mutation controls inherit the same explicit
      # non-qualifying evidence mode. Fixed hardware leaves this unset.
      ALPINE_PRESENTATION_EVIDENCE_MODE: hosted-direct
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install the optional Metal toolchain when absent
        run: |
          if ! xcrun --sdk macosx --find metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk macosx --find metal
          xcrun --sdk macosx --find metallib
      - name: Provision the pinned rust-analyzer compatibility binary
        run: |
          mkdir -p target/rust-analyzer-qualification
          curl --fail --location --silent --show-error \
            https://github.com/rust-lang/rust-analyzer/releases/download/2026-08-17.4/rust-analyzer-aarch64-apple-darwin.gz \
            --output target/rust-analyzer-qualification/rust-analyzer.gz
          echo "ece932daf2f077be87bf745d2eb0a62cbc550f4b1e2e31ca76dfafdd0cc599b3  target/rust-analyzer-qualification/rust-analyzer.gz" \
            | shasum -a 256 --check
          gzip -dc target/rust-analyzer-qualification/rust-analyzer.gz \
            > target/rust-analyzer-qualification/rust-analyzer
          chmod +x target/rust-analyzer-qualification/rust-analyzer
          echo "ALPINE_RUST_ANALYZER=$PWD/target/rust-analyzer-qualification/rust-analyzer" >> "$GITHUB_ENV"
          find apps/alpine-editor/tests/fixtures/rust-analyzer-workspace -type f -print0 \
            | sort -z \
            | xargs -0 shasum -a 256 \
            > target/rust-analyzer-qualification/workspace-files.sha256
          {
            echo "release=2026-08-17.4"
            echo "asset=rust-analyzer-aarch64-apple-darwin.gz"
            echo "asset_sha256=ece932daf2f077be87bf745d2eb0a62cbc550f4b1e2e31ca76dfafdd0cc599b3"
            target/rust-analyzer-qualification/rust-analyzer --version
            sw_vers
            uname -m
            shasum -a 256 target/rust-analyzer-qualification/workspace-files.sha256
          } | tee target/rust-analyzer-qualification/environment.txt
      - name: Qualify the real rust-analyzer document lifecycle
        run: |
          cargo test --locked -p alpine-editor \
            lsp_client::tests::pinned_rust_analyzer_qualifies_real_document_lifecycle \
            -- --ignored --exact --nocapture
          cargo test --locked -p alpine-editor \
            rust_diagnostics::tests::pinned_rust_analyzer_drives_product_open_edit_and_diagnostic_admission \
            -- --ignored --exact --nocapture
      - name: Run Metal API and shader validation
        run: scripts/check-metal.sh
      - name: Upload compiled shader evidence
        id: upload-metal-shader-primary
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: metal-shader-${{ github.sha }}
          path: |
            target/metal/offscreen.metallib
            target/metal/offscreen.metallib.manifest.txt
          retention-days: 7
          if-no-files-found: error
      - name: Retry compiled shader evidence upload
        if: always() && steps.upload-metal-shader-primary.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: metal-shader-${{ github.sha }}
          path: |
            target/metal/offscreen.metallib
            target/metal/offscreen.metallib.manifest.txt
          retention-days: 7
          if-no-files-found: error
      - name: Upload native lifecycle soak evidence
        id: upload-native-lifecycle-primary
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-lifecycle-${{ github.sha }}
          path: target/native-lifecycle-*.toml
          retention-days: 30
          if-no-files-found: warn
      - name: Retry native lifecycle soak evidence upload
        if: always() && steps.upload-native-lifecycle-primary.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-lifecycle-${{ github.sha }}
          path: target/native-lifecycle-*.toml
          retention-days: 30
          if-no-files-found: warn
      - name: Upload rust-analyzer compatibility evidence
        id: upload-rust-analyzer-compatibility-primary
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-analyzer-compatibility-${{ github.sha }}
          path: |
            target/rust-analyzer-qualification/environment.txt
            target/rust-analyzer-qualification/workspace-files.sha256
          retention-days: 7
          if-no-files-found: error
      - name: Retry rust-analyzer compatibility evidence upload
        if: always() && steps.upload-rust-analyzer-compatibility-primary.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-analyzer-compatibility-${{ github.sha }}
          path: |
            target/rust-analyzer-qualification/environment.txt
            target/rust-analyzer-qualification/workspace-files.sha256
          retention-days: 7
          if-no-files-found: error

  ci-pass:
    name: ci-pass
    if: ${{ always() && !cancelled() }}
    needs: [classify, preflight, quality, native, metal-validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require selected evidence
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          CODE_REQUIRED: ${{ needs.classify.outputs.code }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          METAL_REQUIRED: ${{ needs.classify.outputs.metal }}
          METAL_RESULT: ${{ needs.metal-validation.result }}
        run: |
          require_success() {
            test "$2" = success || {
              echo "$1 required success but was $2" >&2
              exit 1
            }
          }
          require_selected() {
            case "$2" in
              true|false) ;;
              *) echo "$1 has an invalid requirement: $2" >&2; exit 1 ;;
            esac
            if test "$2" = true; then
              require_success "$1" "$3"
            elif test "$3" != skipped && test "$3" != success; then
              echo "$1 was not selected but ended as $3" >&2
              exit 1
            fi
          }
          require_success classify "$CLASSIFY_RESULT"
          require_success preflight "$PREFLIGHT_RESULT"
          require_selected quality "$CODE_REQUIRED" "$QUALITY_RESULT"
          require_selected native "$CODE_REQUIRED" "$NATIVE_RESULT"
          require_selected metal-validation "$METAL_REQUIRED" "$METAL_RESULT"
