name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  classify:
    name: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      base_sha: ${{ steps.classify.outputs.base_sha }}
      head_sha: ${{ steps.classify.outputs.head_sha }}
      coverage: ${{ steps.classify.outputs.coverage }}
      mutation: ${{ steps.classify.outputs.mutation }}
      kani: ${{ steps.classify.outputs.kani }}
      miri: ${{ steps.classify.outputs.miri }}
      metal: ${{ steps.classify.outputs.metal }}
      tla: ${{ steps.classify.outputs.tla }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: classify
        name: Select required evidence
        env:
          ALPINE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          ALPINE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ALPINE_PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: scripts/classify-ci.sh

  quality:
    name: quality
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install policy tools
        run: cargo install --locked cargo-deny --version 0.20.2
      - name: Install documentation tools
        run: cargo install --locked mdbook --version 0.5.4
      - name: Show toolchain
        run: rustc --version --verbose
      - name: Check repository policy
        env:
          ALPINE_BASE_SHA: ${{ needs.classify.outputs.base_sha }}
          ALPINE_HEAD_SHA: ${{ needs.classify.outputs.head_sha }}
          ALPINE_PR_BODY: ${{ github.event.pull_request.body }}
          ALPINE_PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          ALPINE_PR_TITLE: ${{ github.event.pull_request.title }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-policy.sh
      - name: Test repository automation
        run: |
          scripts/test-policy.sh
          scripts/test-classifier.sh
          scripts/test-hierarchy.sh
          scripts/test-assurance.sh
          scripts/test-qualification.sh
          scripts/test-zed-lab-evidence.sh
          scripts/check-release.sh
          scripts/test-core-contracts.sh
          scripts/test-metal-contracts.sh
      - name: Validate qualified evidence and GitHub hierarchy
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: cargo run --locked -p alpine-assurance -- validate --github
      - name: Build and test engineering guide
        run: |
          mdbook build
          mdbook test
      - name: Check dependencies and licenses
        run: cargo deny check bans licenses sources
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all targets
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test all targets
        run: cargo test --workspace --all-targets --all-features --locked
      - name: Stress Studio concurrency admission
        run: scripts/test-studio-concurrency-stress.sh
      - name: Test documentation examples
        run: cargo test --workspace --doc --all-features --locked
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked
      - name: Render assurance report
        run: |
          mkdir -p target/assurance
          cargo run --quiet --locked -p alpine-assurance -- report > target/assurance/report.md
      - name: Upload engineering documentation and assurance report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: engineering-evidence-${{ github.sha }}
          path: |
            target/mdbook
            target/assurance/report.md
          retention-days: 7
          if-no-files-found: error
      - name: Upload rustdoc artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rustdoc-${{ github.sha }}
          path: target/doc
          retention-days: 7
          if-no-files-found: error

  native:
    name: native-${{ matrix.name }}
    needs: classify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
          - name: macos-arm64
            os: macos-26
          - name: windows-x64
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Show target
        run: rustc --version --verbose
      - name: Test workspace
        run: cargo test --workspace --all-targets --all-features --locked
      - name: Audit Alpine Studio release product boundary
        if: matrix.name == 'macos-arm64'
        run: scripts/check-product-boundary.sh --binary | tee target/studio-product-boundary.txt
      - name: Upload Alpine Studio product-boundary evidence
        if: matrix.name == 'macos-arm64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: studio-product-boundary-${{ github.sha }}
          path: target/studio-product-boundary.txt
          retention-days: 7
          if-no-files-found: error

  coverage:
    name: coverage
    needs: classify
    if: needs.classify.outputs.coverage == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUST_TEST_THREADS: 1
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install coverage tools
        run: cargo install --locked cargo-llvm-cov --version 0.8.7
      - name: Install LLVM tools
        run: rustup component add llvm-tools-preview
      - name: Measure base coverage
        env:
          BASE_SHA: ${{ needs.classify.outputs.base_sha }}
        run: |
          mkdir -p target
          git worktree add --detach "$RUNNER_TEMP/alpine-coverage-base" "$BASE_SHA"
          cd "$RUNNER_TEMP/alpine-coverage-base"
          coverage_scope=--workspace
          if cargo metadata --format-version 1 --no-deps | grep -q '"name":"alpine-assurance"'; then
            coverage_scope="$coverage_scope --exclude alpine-assurance"
          fi
          CARGO_TARGET_DIR="$RUNNER_TEMP/alpine-coverage-base-target" cargo llvm-cov $coverage_scope --all-features --locked --no-report
          CARGO_TARGET_DIR="$RUNNER_TEMP/alpine-coverage-base-target" cargo llvm-cov report --ignore-filename-regex '(/tests/|_coverage_tests\.rs$|/embedded_tests\.rs$)' --json --summary-only --output-path "$GITHUB_WORKSPACE/target/coverage-base.json"
          CARGO_TARGET_DIR="$RUNNER_TEMP/alpine-coverage-base-target" cargo llvm-cov report --ignore-filename-regex '(/tests/|_coverage_tests\.rs$|/embedded_tests\.rs$)' --lcov --output-path "$GITHUB_WORKSPACE/target/lcov-base.info"
      - name: Measure head coverage
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --workspace --exclude alpine-assurance --all-features --locked --no-report
          cargo llvm-cov report --ignore-filename-regex '(/tests/|_coverage_tests\.rs$|/embedded_tests\.rs$)' --json --summary-only --output-path target/coverage-head.json
          cargo llvm-cov report --ignore-filename-regex '(/tests/|_coverage_tests\.rs$|/embedded_tests\.rs$)' --lcov --output-path target/lcov.info
          cargo llvm-cov report --ignore-filename-regex '(/tests/|_coverage_tests\.rs$|/embedded_tests\.rs$)' --html --output-dir target/coverage-html
      - name: Enforce coverage contracts
        env:
          ALPINE_HEAD_SHA: ${{ needs.classify.outputs.head_sha }}
        run: scripts/check-coverage.sh target/coverage-base.json target/coverage-head.json target/lcov-base.info target/lcov.info ${{ needs.classify.outputs.base_sha }}
      - name: Enforce assurance-tool coverage floor
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov -p alpine-assurance --locked --fail-under-lines 80 --fail-under-functions 80
      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-${{ github.sha }}
          path: |
            target/coverage-head.json
            target/lcov-base.info
            target/lcov.info
            target/coverage-html
          retention-days: 7
          if-no-files-found: warn

  mutation-diff:
    name: mutation-diff-${{ matrix.id }}
    needs: classify
    if: needs.classify.outputs.mutation == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: 1
            shard: 0/8
          - id: 2
            shard: 1/8
          - id: 3
            shard: 2/8
          - id: 4
            shard: 3/8
          - id: 5
            shard: 4/8
          - id: 6
            shard: 5/8
          - id: 7
            shard: 6/8
          - id: 8
            shard: 7/8
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install mutation tools
        run: cargo install --locked cargo-mutants --version 27.1.0
      - name: Build changed-code mutation set
        run: |
          mkdir -p target
          git diff ${{ needs.classify.outputs.base_sha }}...${{ needs.classify.outputs.head_sha }} > target/alpine.diff
      - name: Require changed shipping mutants to be killed
        # Linux cannot execute macOS-only validation entry points. Their
        # mutations are owned by the required Apple Silicon Metal job below.
        run: cargo mutants --workspace --exclude alpine-assurance --exclude 'crates/alpine-text-layout/src/native.rs' --exclude 'crates/alpine-platform-macos/src/native_accessibility.rs' --exclude 'apps/alpine-studio/src/native_validation/accessibility_process.rs' --exclude-re 'native_validation::|native_file_app|native_explicit_path_app|reset_native_validation_dispatch_counts|native_validation_dispatch_counts|reset_native_validation_language_evidence|record_native_validation_language_snapshot|record_native_validation_language_publication|record_native_validation_language_submission|record_native_validation_language_observation|native_validation_language_evidence|initial_scene|run_on_native_surface|activation_revision_and_target_identity_are_preserved' --shard "${{ matrix.shard }}" --no-shuffle --in-diff target/alpine.diff --output "target/mutants-${{ matrix.id }}.out" -- --locked
      - name: Require changed assurance mutants to be killed
        run: cargo mutants -p alpine-assurance --shard "${{ matrix.shard }}" --no-shuffle --in-diff target/alpine.diff --output "target/assurance-mutants-${{ matrix.id }}.out" -- --locked
      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mutation-${{ matrix.id }}-${{ github.sha }}
          path: |
            target/mutants-${{ matrix.id }}.out
            target/assurance-mutants-${{ matrix.id }}.out
          retention-days: 7
          if-no-files-found: warn

  kani:
    name: kani
    needs: classify
    if: needs.classify.outputs.kani == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Kani
        run: |
          cargo install --locked kani-verifier --version 0.67.0
          scripts/setup-kani.sh
      - name: Verify bounded Rust properties
        run: |
          cargo kani list --format json
          mkdir -p target/kani
          mv kani-list.json target/kani/harnesses.json
          set -o pipefail
          cargo kani --workspace 2>&1 | tee target/kani/proofs.log
          scripts/analyze-kani-effectiveness.sh
      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kani-${{ github.sha }}
          path: target/kani
          retention-days: 7
          if-no-files-found: warn

  tla:
    name: tla
    needs: classify
    if: needs.classify.outputs.tla == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Java runtime
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - name: Check bounded TLA+ models and faulty controls
        run: scripts/check-tla.sh pull-request
      - name: Upload model-checking evidence and counterexamples
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tla-${{ github.sha }}
          path: target/tla
          retention-days: 7
          if-no-files-found: error

  miri:
    name: miri-${{ matrix.partition }}
    needs: classify
    if: needs.classify.outputs.miri == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        include:
          - partition: foundation
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-app-01
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-app-02
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-app-03
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-app-04
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-app-05
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-app-06
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-app-07
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-command
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-language-transport
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-language-completion
            miri_flags: ""
          - partition: studio-language-diagnostics
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-language-navigation
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-language-symbols
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-language-workspace-edit
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-language-protocol-01
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-language-protocol-02
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-language-protocol-03
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-language-protocol-04
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-language-protocol-05
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-language-protocol-06
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-language-protocol-07
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-language-protocol-08
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-language-protocol-09
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-model
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-persistence
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-workspace
            miri_flags: -Zmiri-disable-isolation
          - partition: text
            miri_flags: ""
          - partition: text-layout-publication
            miri_flags: ""
          - partition: text-layout-coverage
            miri_flags: ""
          - partition: text-layout-atlas-basic
            miri_flags: ""
          - partition: text-layout-atlas-model
            miri_flags: ""
          - partition: text-layout-cache
            miri_flags: ""
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Miri toolchain
        run: rustup toolchain install nightly-2026-08-01 --profile minimal --component miri
      - name: Check host-testable memory behavior
        env:
          MIRIFLAGS: ${{ matrix.miri_flags }}
        run: scripts/run-miri-partition.sh "${{ matrix.partition }}"

  metal-validation:
    name: metal-validation
    needs: classify
    if: needs.classify.outputs.metal == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      ALPINE_VALIDATION_DEPLOYMENT_TARGET: "26.0"
      # Hosted macOS runners may have no display that Core Animation can
      # qualify. Validation and mutation controls inherit the same explicit
      # non-qualifying evidence mode. Fixed hardware leaves this unset.
      ALPINE_PRESENTATION_EVIDENCE_MODE: hosted-direct
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install the optional Metal toolchain when absent
        run: |
          if ! xcrun --sdk macosx --find metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk macosx --find metal
          xcrun --sdk macosx --find metallib
      - name: Provision the pinned rust-analyzer compatibility binary
        run: |
          mkdir -p target/rust-analyzer-qualification
          curl --fail --location --silent --show-error \
            https://github.com/rust-lang/rust-analyzer/releases/download/2026-08-17.4/rust-analyzer-aarch64-apple-darwin.gz \
            --output target/rust-analyzer-qualification/rust-analyzer.gz
          echo "ece932daf2f077be87bf745d2eb0a62cbc550f4b1e2e31ca76dfafdd0cc599b3  target/rust-analyzer-qualification/rust-analyzer.gz" \
            | shasum -a 256 --check
          gzip -dc target/rust-analyzer-qualification/rust-analyzer.gz \
            > target/rust-analyzer-qualification/rust-analyzer
          chmod +x target/rust-analyzer-qualification/rust-analyzer
          echo "ALPINE_RUST_ANALYZER=$PWD/target/rust-analyzer-qualification/rust-analyzer" >> "$GITHUB_ENV"
          find apps/alpine-studio/tests/fixtures/rust-analyzer-workspace -type f -print0 \
            | sort -z \
            | xargs -0 shasum -a 256 \
            > target/rust-analyzer-qualification/workspace-files.sha256
          {
            echo "release=2026-08-17.4"
            echo "asset=rust-analyzer-aarch64-apple-darwin.gz"
            echo "asset_sha256=ece932daf2f077be87bf745d2eb0a62cbc550f4b1e2e31ca76dfafdd0cc599b3"
            target/rust-analyzer-qualification/rust-analyzer --version
            sw_vers
            uname -m
            shasum -a 256 target/rust-analyzer-qualification/workspace-files.sha256
          } | tee target/rust-analyzer-qualification/environment.txt
      - name: Qualify the real rust-analyzer document lifecycle
        run: |
          cargo test --locked -p alpine-studio \
            lsp_client::tests::pinned_rust_analyzer_qualifies_real_document_lifecycle \
            -- --ignored --exact --nocapture
          cargo test --locked -p alpine-studio \
            rust_diagnostics::tests::pinned_rust_analyzer_drives_product_open_edit_and_diagnostic_admission \
            -- --ignored --exact --nocapture
      - name: Run Metal API and shader validation
        run: scripts/check-metal.sh
      - name: Upload compiled shader evidence
        id: upload-metal-shader-primary
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: metal-shader-${{ github.sha }}
          path: |
            target/metal/offscreen.metallib
            target/metal/offscreen.metallib.manifest.txt
          retention-days: 7
          if-no-files-found: error
      - name: Retry compiled shader evidence upload
        if: always() && steps.upload-metal-shader-primary.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: metal-shader-${{ github.sha }}
          path: |
            target/metal/offscreen.metallib
            target/metal/offscreen.metallib.manifest.txt
          retention-days: 7
          if-no-files-found: error
      - name: Upload native lifecycle soak evidence
        id: upload-native-lifecycle-primary
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-lifecycle-${{ github.sha }}
          path: target/native-lifecycle-*.toml
          retention-days: 30
          if-no-files-found: warn
      - name: Retry native lifecycle soak evidence upload
        if: always() && steps.upload-native-lifecycle-primary.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-lifecycle-${{ github.sha }}
          path: target/native-lifecycle-*.toml
          retention-days: 30
          if-no-files-found: warn
      - name: Upload rust-analyzer compatibility evidence
        id: upload-rust-analyzer-compatibility-primary
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-analyzer-compatibility-${{ github.sha }}
          path: |
            target/rust-analyzer-qualification/environment.txt
            target/rust-analyzer-qualification/workspace-files.sha256
          retention-days: 7
          if-no-files-found: error
      - name: Retry rust-analyzer compatibility evidence upload
        if: always() && steps.upload-rust-analyzer-compatibility-primary.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-analyzer-compatibility-${{ github.sha }}
          path: |
            target/rust-analyzer-qualification/environment.txt
            target/rust-analyzer-qualification/workspace-files.sha256
          retention-days: 7
          if-no-files-found: error

  native-mutation:
    name: native-mutation-${{ matrix.id }}
    needs: classify
    if: needs.classify.outputs.metal == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: 1
            shard: 0/8
          - id: 2
            shard: 1/8
          - id: 3
            shard: 2/8
          - id: 4
            shard: 3/8
          - id: 5
            shard: 4/8
          - id: 6
            shard: 5/8
          - id: 7
            shard: 6/8
          - id: 8
            shard: 7/8
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      ALPINE_VALIDATION_DEPLOYMENT_TARGET: "26.0"
      ALPINE_PRESENTATION_EVIDENCE_MODE: hosted-direct
      RUSTFLAGS: --cfg alpine_native_validation
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install native mutation tooling
        run: cargo install --locked cargo-mutants --version 27.1.0
      - name: Install the optional Metal toolchain when absent
        run: |
          if ! xcrun --sdk macosx --find metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk macosx --find metal
          xcrun --sdk macosx --find metallib
      - name: Build changed-native mutation set
        run: |
          mkdir -p target
          git diff ${{ needs.classify.outputs.base_sha }}...${{ needs.classify.outputs.head_sha }} > target/alpine.diff
      - name: Require changed native mutants to be killed
        run: |
          cargo mutants --no-config --file crates/alpine-metal/src/native.rs --features platform-spi --shard "${{ matrix.shard }}" --no-shuffle --in-diff target/alpine.diff --output "target/native-mutants-${{ matrix.id }}.out" -- --locked
          cargo mutants --no-config --file crates/alpine-metal/src/platform_spi.rs --features platform-spi --shard "${{ matrix.shard }}" --no-shuffle --in-diff target/alpine.diff --output "target/native-platform-spi-mutants-${{ matrix.id }}.out" -- --locked
          cargo mutants --no-config --file crates/alpine-metal/src/submission.rs --features platform-spi --re 'MetalBackend::render_callback_drawable|record_drawable_attempt|verify_drawable_attempt_lifecycle|complete_drawable_attempt' --shard "${{ matrix.shard }}" --no-shuffle --in-diff target/alpine.diff --output "target/native-submission-mutants-${{ matrix.id }}.out" -- --locked
          env -u ALPINE_RUST_ANALYZER cargo mutants --no-config --file crates/alpine-platform-macos/src/lib.rs --exclude-re 'validate_initialization_rollback|native_validation::arm_window_close|native_validation::arm_user_window_close|native_validation::NativeAccessibilityEvidence::' --test-package alpine-platform-macos --test-package alpine-studio --shard "${{ matrix.shard }}" --no-shuffle --in-diff target/alpine.diff --output "target/native-platform-contract-mutants-${{ matrix.id }}.out" -- --locked
          env -u ALPINE_RUST_ANALYZER cargo mutants --no-config --file crates/alpine-platform-macos/src/native.rs --exclude-re 'validate_initialization_rollback|run_until_frame_terminal|stop_validation_event_loop|schedule_validation_window_close|schedule_validation_user_window_close|NativeSurface::arm_window_close|NativeSurface::arm_user_window_close' --test-package alpine-platform-macos --test-package alpine-studio --shard "${{ matrix.shard }}" --no-shuffle --in-diff target/alpine.diff --output "target/native-platform-mutants-${{ matrix.id }}.out" -- --locked
          env -u ALPINE_RUST_ANALYZER cargo mutants --no-config --file crates/alpine-platform-macos/src/native_accessibility.rs --re 'RefreshOutcome::post|NotificationIntent::kind|NotificationIntent::record|NotificationIntent::retained_bytes|NotificationIntent::post|NativeAccessibilityAdapter::refresh_view_if_active|NativeAccessibilityAdapter::refresh_view|NativeAccessibilityAdapter::reconcile_elements|NativeAccessibilityAdapter::append_notification_intents|NativeAccessibilityAdapter::push_notification|NativeAccessibilityAdapter::push_layout_notification|NativeAccessibilityAdapter::push_announcement|NativeAccessibilityAdapter::record_posted|NativeAccessibilityAdapter::begin_revoke|NativeAccessibilityAdapter::finish_revoke|NativeAccessibilityAdapter::set_selection|NativeAccessibilityAdapter::activate|NativeAccessibilityElement::with_adapter|NativeAccessibilityElement::with_adapter_mut|NativeAccessibilityElement::accessibility_frame_impl|layout_user_info_valid|announcement_user_info_valid|layout_semantics_changed|reusable_semantics|checked_range' --test-package alpine-platform-macos --shard "${{ matrix.shard }}" --no-shuffle --in-diff target/alpine.diff --output "target/native-accessibility-mutants-${{ matrix.id }}.out" -- --locked --test native_accessibility
          env -u ALPINE_RUST_ANALYZER cargo mutants --no-config --file crates/alpine-platform-macos/src/native_accessibility.rs --re 'bounded_screen_frame|NativeAccessibilityAdapter::inspect_view|NativeAccessibilityAdapter::activate_named_view' --test-package alpine-platform-macos --test-package alpine-studio --shard "${{ matrix.shard }}" --no-shuffle --in-diff target/alpine.diff --output "target/native-studio-accessibility-mutants-${{ matrix.id }}.out" -- --locked
          env -u ALPINE_RUST_ANALYZER ALPINE_STUDIO_NATIVE_PROCESS_SCOPE=accessibility cargo mutants --no-config --file apps/alpine-studio/src/native_validation/accessibility_process.rs --test-package alpine-studio --shard "${{ matrix.shard }}" --no-shuffle --in-diff target/alpine.diff --output "target/native-studio-accessibility-process-mutants-${{ matrix.id }}.out" -- --locked
          env -u ALPINE_RUST_ANALYZER cargo mutants --no-config --file crates/alpine-runtime/src/lib.rs --re 'run_on_native_surface' --test-package alpine-studio --shard "${{ matrix.shard }}" --no-shuffle --in-diff target/alpine.diff --output "target/native-runtime-mutants-${{ matrix.id }}.out" -- --locked
          if find "target/native-runtime-mutants-${{ matrix.id }}.out" -name unviable.txt -type f -size +0c | grep -q .; then
            find "target/native-runtime-mutants-${{ matrix.id }}.out" -name unviable.txt -type f -size +0c -exec cat {} \;
            exit 1
          fi
          env -u ALPINE_RUST_ANALYZER cargo mutants --no-config --file apps/alpine-studio/src/lib.rs --re 'native_validation::|native_file_app|native_explicit_path_app|reset_native_validation_dispatch_counts|native_validation_dispatch_counts|reset_native_validation_language_evidence|record_native_validation_language_snapshot|record_native_validation_language_publication|record_native_validation_language_submission|record_native_validation_language_observation|native_validation_language_evidence|initial_scene' --shard "${{ matrix.shard }}" --no-shuffle --in-diff target/alpine.diff --output "target/native-studio-mutants-${{ matrix.id }}.out" -- --locked
      - name: Upload native mutation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-mutation-${{ matrix.id }}-${{ github.sha }}
          path: |
            target/native-mutants-${{ matrix.id }}.out
            target/native-platform-spi-mutants-${{ matrix.id }}.out
            target/native-submission-mutants-${{ matrix.id }}.out
            target/native-platform-contract-mutants-${{ matrix.id }}.out
            target/native-platform-mutants-${{ matrix.id }}.out
            target/native-accessibility-mutants-${{ matrix.id }}.out
            target/native-studio-accessibility-mutants-${{ matrix.id }}.out
            target/native-studio-accessibility-process-mutants-${{ matrix.id }}.out
            target/native-runtime-mutants-${{ matrix.id }}.out
            target/native-studio-mutants-${{ matrix.id }}.out
          retention-days: 7
          if-no-files-found: warn

  ci-pass:
    name: ci-pass
    if: always()
    needs: [classify, quality, native, coverage, mutation-diff, kani, tla, miri, metal-validation, native-mutation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require selected evidence
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          COVERAGE_REQUIRED: ${{ needs.classify.outputs.coverage }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          MUTATION_REQUIRED: ${{ needs.classify.outputs.mutation }}
          MUTATION_RESULT: ${{ needs.mutation-diff.result }}
          KANI_REQUIRED: ${{ needs.classify.outputs.kani }}
          KANI_RESULT: ${{ needs.kani.result }}
          TLA_REQUIRED: ${{ needs.classify.outputs.tla }}
          TLA_RESULT: ${{ needs.tla.result }}
          MIRI_REQUIRED: ${{ needs.classify.outputs.miri }}
          MIRI_RESULT: ${{ needs.miri.result }}
          METAL_REQUIRED: ${{ needs.classify.outputs.metal }}
          METAL_RESULT: ${{ needs.metal-validation.result }}
          NATIVE_MUTATION_RESULT: ${{ needs.native-mutation.result }}
        run: |
          require_success() {
            test "$2" = success || {
              echo "$1 required success but was $2" >&2
              exit 1
            }
          }
          require_selected() {
            if test "$2" = true; then
              require_success "$1" "$3"
            elif test "$3" != skipped && test "$3" != success; then
              echo "$1 was not selected but ended as $3" >&2
              exit 1
            fi
          }
          require_success classify "$CLASSIFY_RESULT"
          require_success quality "$QUALITY_RESULT"
          require_success native "$NATIVE_RESULT"
          require_selected coverage "$COVERAGE_REQUIRED" "$COVERAGE_RESULT"
          require_selected mutation-diff "$MUTATION_REQUIRED" "$MUTATION_RESULT"
          require_selected kani "$KANI_REQUIRED" "$KANI_RESULT"
          require_selected tla "$TLA_REQUIRED" "$TLA_RESULT"
          require_selected miri "$MIRI_REQUIRED" "$MIRI_RESULT"
          require_selected metal-validation "$METAL_REQUIRED" "$METAL_RESULT"
          require_selected native-mutation "$METAL_REQUIRED" "$NATIVE_MUTATION_RESULT"
