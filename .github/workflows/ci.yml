name: CI

# Throwaway branch exp/m0e-ab: same-VM A/B of main against the M0e.2 #533 fix.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "1"

jobs:
  m0e-ab:
    name: m0e-ab-${{ matrix.shard }}
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      ALPINE_VALIDATION_DEPLOYMENT_TARGET: "26.0"
      ALPINE_PRESENTATION_EVIDENCE_MODE: hosted-direct
      AB_A_SHA: fd2a390ca8d82f77742eb4c24f544d8a2002b655
      AB_B_SHA: 1760a872fd08bddf198a1b2008c354151b918b3b
      AB_PAIRS: "1250"
      AB_CLOSE_PAIRS: "100"
      AB_LLDB_RUNS: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Alternate the two arms on one VM
        run: scripts/ab-m0e.sh
      - name: Keep summaries, failures and backtraces
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m0e-ab-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            target/ab/summary.tsv
            target/ab/failures
            target/ab/backtraces
          retention-days: 14
          if-no-files-found: warn
