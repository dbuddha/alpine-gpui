name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: quality
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Cargo registry and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Install cargo-deny
        env:
          CARGO_DENY_VERSION: 0.20.2
          CARGO_DENY_SHA256: fe67d82a10d8597a3549364cb733a3f9cc1bfff9031b7ae46384a9f2a72090c3
        run: |
          archive="cargo-deny-$CARGO_DENY_VERSION-aarch64-apple-darwin"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/$archive.tar.gz" \
            --output "$RUNNER_TEMP/$archive.tar.gz"
          echo "$CARGO_DENY_SHA256  $RUNNER_TEMP/$archive.tar.gz" | shasum -a 256 --check
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          mkdir -p "$HOME/.cargo/bin"
          install -m 0755 "$RUNNER_TEMP/$archive/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
          cargo deny --version
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Check repository policy
        run: scripts/check-policy.sh
      - name: Check the product boundary
        run: scripts/check-product-boundary.sh
      - name: Check dependencies and licenses
        run: cargo deny check bans licenses sources advisories
      - name: Test all targets
        run: cargo test --workspace --all-targets --all-features --locked
      - name: Test alpine-metal without platform-spi
        run: cargo test --locked -p alpine-metal --all-targets
      - name: Stress editor concurrency admission
        run: scripts/test-studio-concurrency-stress.sh
      - name: Test Rust API examples
        run: cargo test --workspace --doc --all-features --locked
      - name: Build Rust API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

  native-macos-arm64:
    name: native-macos-arm64
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Cargo registry and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Verify native execution
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
          MACOSX_DEPLOYMENT_TARGET: "15.0"
          ALPINE_VALIDATION_DEPLOYMENT_TARGET: "26.0"
          ALPINE_PRESENTATION_EVIDENCE_MODE: hosted-direct
          RUSTFLAGS: --cfg alpine_native_validation
        run: scripts/check-ci-native-admission.sh
      - name: Audit the release binary product boundary
        run: scripts/check-product-boundary.sh --binary
      - name: Retain native execution output
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-acceptance-${{ github.sha }}-${{ github.run_attempt }}
          path: target/native-acceptance
          retention-days: 7
          if-no-files-found: warn

  metal-validation:
    name: metal-validation
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      ALPINE_VALIDATION_DEPLOYMENT_TARGET: "26.0"
      # Hosted macOS runners may have no display that Core Animation can
      # qualify, so validation runs in the explicit non-qualifying evidence
      # mode. Fixed hardware leaves this unset.
      ALPINE_PRESENTATION_EVIDENCE_MODE: hosted-direct
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Cargo registry and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Install the optional Metal toolchain when absent
        run: |
          if ! xcrun --sdk macosx --find metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk macosx --find metal
          xcrun --sdk macosx --find metallib
      - name: Provision the pinned rust-analyzer binary
        run: |
          mkdir -p target/rust-analyzer-qualification
          curl --fail --location --silent --show-error \
            https://github.com/rust-lang/rust-analyzer/releases/download/2026-08-17.4/rust-analyzer-aarch64-apple-darwin.gz \
            --output target/rust-analyzer-qualification/rust-analyzer.gz
          echo "ece932daf2f077be87bf745d2eb0a62cbc550f4b1e2e31ca76dfafdd0cc599b3  target/rust-analyzer-qualification/rust-analyzer.gz" \
            | shasum -a 256 --check
          gzip -dc target/rust-analyzer-qualification/rust-analyzer.gz \
            > target/rust-analyzer-qualification/rust-analyzer
          chmod +x target/rust-analyzer-qualification/rust-analyzer
          target/rust-analyzer-qualification/rust-analyzer --version
          echo "ALPINE_RUST_ANALYZER=$PWD/target/rust-analyzer-qualification/rust-analyzer" >> "$GITHUB_ENV"
      - name: Qualify the real rust-analyzer document lifecycle
        run: |
          cargo test --locked -p alpine-editor \
            lsp_client::tests::pinned_rust_analyzer_qualifies_real_document_lifecycle \
            -- --ignored --exact --nocapture
          cargo test --locked -p alpine-editor \
            rust_diagnostics::tests::pinned_rust_analyzer_drives_product_open_edit_and_diagnostic_admission \
            -- --ignored --exact --nocapture
      - name: Run Metal API and shader validation
        run: scripts/check-metal.sh
      - name: Retain native lifecycle output
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: metal-validation-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            target/native-lifecycle-*.toml
            target/native-acceptance
          retention-days: 7
          if-no-files-found: warn

  ci-pass:
    name: ci-pass
    if: ${{ always() && !cancelled() }}
    needs: [quality, native-macos-arm64, metal-validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          NATIVE_RESULT: ${{ needs.native-macos-arm64.result }}
          METAL_RESULT: ${{ needs.metal-validation.result }}
        run: |
          require_success() {
            test "$2" = success || {
              echo "$1 required success but was ${2:-missing}" >&2
              exit 1
            }
          }
          require_success quality "$QUALITY_RESULT"
          require_success native-macos-arm64 "$NATIVE_RESULT"
          require_success metal-validation "$METAL_RESULT"
