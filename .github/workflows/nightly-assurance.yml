name: Nightly assurance

on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-assurance
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  tla:
    name: tla-all
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Java runtime
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - name: Check expanded TLA+ models and faulty controls
        run: scripts/check-tla.sh nightly
      - name: Upload model-checking evidence and counterexamples
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tla-nightly-${{ github.sha }}
          path: target/tla
          retention-days: 14
          if-no-files-found: error

  kani:
    name: kani-all
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Kani
        run: |
          cargo install --locked kani-verifier --version 0.67.0
          scripts/setup-kani.sh
      - name: Verify all bounded Rust properties
        run: |
          cargo kani list --format json
          mkdir -p target/kani
          mv kani-list.json target/kani/harnesses.json
          set -o pipefail
          cargo kani --workspace --output-format=terse 2>&1 | tee target/kani/proofs.log
      - name: Upload proof inventory and results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kani-nightly-${{ github.sha }}
          path: target/kani
          retention-days: 14
          if-no-files-found: error

  miri:
    name: miri-all-${{ matrix.partition }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        include:
          - partition: foundation
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-app-01
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-app-02
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-app-03
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-app-04
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-app-05
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-app-06
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-app-07
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-command
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-language-transport
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-language-completion
            miri_flags: ""
          - partition: studio-language-diagnostics
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-language-navigation
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-language-symbols
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-language-workspace-edit
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-language-protocol-01
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-language-protocol-02
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-language-protocol-03
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-language-protocol-04
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-language-protocol-05
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-language-protocol-06
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-language-protocol-07
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-language-protocol-08
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-language-protocol-09
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-model
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-persistence
            miri_flags: -Zmiri-disable-isolation
          - partition: studio-workspace
            miri_flags: -Zmiri-disable-isolation
          - partition: text
            miri_flags: ""
          - partition: text-layout-publication
            miri_flags: ""
          - partition: text-layout-coverage
            miri_flags: ""
          - partition: text-layout-atlas-basic
            miri_flags: ""
          - partition: text-layout-atlas-model
            miri_flags: ""
          - partition: text-layout-cache
            miri_flags: ""
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Miri toolchain
        run: rustup toolchain install nightly-2026-08-01 --profile minimal --component miri
      - name: Check workspace memory behavior
        env:
          MIRIFLAGS: ${{ matrix.miri_flags }}
        run: scripts/run-miri-partition.sh "${{ matrix.partition }}"

  advisories:
    name: dependency-advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install dependency policy tool
        run: cargo install --locked cargo-deny --version 0.20.2
      - name: Check dependency advisories
        run: cargo deny check advisories

  fuzz-smoke:
    name: fuzz-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned fuzz toolchain
        if: ${{ hashFiles('fuzz/Cargo.toml') != '' }}
        run: |
          rustup toolchain install nightly-2026-08-01 --profile minimal
          cargo +nightly-2026-08-01 install --locked cargo-fuzz --version 0.13.2
      - name: Run each configured fuzz target
        run: |
          if test ! -f fuzz/Cargo.toml; then
            echo "No fuzz target is required by an implemented subsystem yet."
            exit 0
          fi
          cargo +nightly-2026-08-01 fuzz list | while read -r target; do
            cargo +nightly-2026-08-01 fuzz run "$target" -- -max_total_time=60
          done

  metal-validation:
    name: metal-validation
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      # Hosted validation cannot qualify physical presentation. Keep every
      # native test and mutation baseline on the same explicit direct-present
      # evidence contract; fixed hardware leaves this variable unset.
      ALPINE_PRESENTATION_EVIDENCE_MODE: hosted-direct
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install native mutation tooling
        run: cargo install --locked cargo-mutants --version 27.1.0
      - name: Install the optional Metal toolchain when absent
        run: |
          if ! xcrun --sdk macosx --find metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk macosx --find metal
          xcrun --sdk macosx --find metallib
      - name: Validate Metal when implemented
        run: |
          if cargo metadata --format-version 1 --no-deps | grep -q '"name":"alpine-metal"'; then
            scripts/check-metal.sh
          else
            echo "Metal validation activates when alpine-metal is implemented."
          fi
      - name: Require all native Metal mutants to be killed
        env:
          RUSTFLAGS: --cfg alpine_native_validation
        run: |
          if cargo metadata --format-version 1 --no-deps | grep -q '"name":"alpine-metal"'; then
            cargo mutants --no-config --file crates/alpine-metal/src/native.rs --features platform-spi --exclude-re 'tests::' --no-shuffle --output target/native-mutants.out -- --locked
            cargo mutants --no-config --file crates/alpine-metal/src/platform_spi.rs --features platform-spi --no-shuffle --output target/native-platform-spi-mutants.out -- --locked
            cargo mutants --no-config --file crates/alpine-metal/src/submission.rs --features platform-spi --re 'MetalBackend::render_callback_drawable|record_drawable_attempt|verify_drawable_attempt_lifecycle|complete_drawable_attempt' --no-shuffle --output target/native-submission-mutants.out -- --locked
            cargo mutants --no-config --file crates/alpine-platform-macos/src/native.rs --exclude-re 'validate_initialization_rollback|run_until_frame_terminal|stop_validation_event_loop|schedule_validation_window_close|NativeSurface::arm_window_close' --no-shuffle --output target/native-platform-mutants.out -- --locked
            cargo mutants --no-config --file crates/alpine-runtime/src/lib.rs --re 'run_on_native_surface' --test-package alpine-studio --no-shuffle --output target/native-runtime-mutants.out -- --locked
            if find target/native-runtime-mutants.out -name unviable.txt -type f -size +0c | grep -q .; then
              find target/native-runtime-mutants.out -name unviable.txt -type f -size +0c -exec cat {} \;
              exit 1
            fi
            cargo mutants --no-config --file apps/alpine-studio/src/lib.rs --re 'native_validation::|native_file_app|initial_scene' --no-shuffle --output target/native-studio-mutants.out -- --locked
          else
            echo "Native mutation activates when alpine-metal is implemented."
          fi
      - name: Upload native mutation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-mutation-nightly-${{ github.sha }}
          path: |
            target/native-mutants.out
            target/native-platform-spi-mutants.out
            target/native-submission-mutants.out
            target/native-platform-mutants.out
            target/native-runtime-mutants.out
            target/native-studio-mutants.out
          retention-days: 14
          if-no-files-found: warn
      - name: Upload compiled shader evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: metal-shader-nightly-${{ github.sha }}
          path: |
            target/metal/offscreen.metallib
            target/metal/offscreen.metallib.manifest.txt
          retention-days: 14
          if-no-files-found: error

  native-platform-contract-mutation:
    name: native-platform-contract-mutation-${{ matrix.id }}
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: 1
            shard: 0/4
          - id: 2
            shard: 1/4
          - id: 3
            shard: 2/4
          - id: 4
            shard: 3/4
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      ALPINE_PRESENTATION_EVIDENCE_MODE: hosted-direct
      RUSTFLAGS: --cfg alpine_native_validation
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install native mutation tooling
        run: cargo install --locked cargo-mutants --version 27.1.0
      - name: Install the optional Metal toolchain when absent
        run: |
          if ! xcrun --sdk macosx --find metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk macosx --find metal
          xcrun --sdk macosx --find metallib
      - name: Require exhaustive native platform contract mutants to be killed
        run: |
          mkdir -p target
          cargo mutants --no-config --file crates/alpine-platform-macos/src/lib.rs --exclude-re 'validate_initialization_rollback|native_validation::arm_window_close|native_validation::NativeAccessibilityEvidence::|native_validation::arm_user_window_close|native_validation::arm_programmatic_window_close|native_validation::commit_native_text' --shard "${{ matrix.shard }}" --no-shuffle --output "target/native-platform-contract-mutants-${{ matrix.id }}.out" -- --locked
          if [ "${{ matrix.id }}" = "1" ]; then
            cargo mutants --no-config --file crates/alpine-platform-macos/src/lib.rs --re 'native_validation::arm_user_window_close|native_validation::arm_programmatic_window_close|native_validation::commit_native_text' --test-package alpine-studio --no-shuffle --output target/native-platform-studio-contract-mutants.out -- --locked
          fi
      - name: Upload native platform contract mutation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-platform-contract-mutation-${{ matrix.id }}-${{ github.sha }}
          path: |
            target/native-platform-contract-mutants-${{ matrix.id }}.out
            target/native-platform-studio-contract-mutants.out
          retention-days: 14
          if-no-files-found: error

  native-accessibility-mutation:
    name: native-accessibility-mutation-${{ matrix.id }}
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: 1
            shard: 0/8
          - id: 2
            shard: 1/8
          - id: 3
            shard: 2/8
          - id: 4
            shard: 3/8
          - id: 5
            shard: 4/8
          - id: 6
            shard: 5/8
          - id: 7
            shard: 6/8
          - id: 8
            shard: 7/8
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      ALPINE_PRESENTATION_EVIDENCE_MODE: hosted-direct
      RUSTFLAGS: --cfg alpine_native_validation
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install native mutation tooling
        run: cargo install --locked cargo-mutants --version 27.1.0
      - name: Install the optional Metal toolchain when absent
        run: |
          if ! xcrun --sdk macosx --find metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk macosx --find metal
          xcrun --sdk macosx --find metallib
      - name: Require exhaustive native accessibility mutants to be killed
        run: |
          mkdir -p target
          cargo mutants --no-config --file crates/alpine-platform-macos/src/native_accessibility.rs --test-package alpine-platform-macos --shard "${{ matrix.shard }}" --no-shuffle --output "target/native-accessibility-mutants-${{ matrix.id }}.out" -- --locked
      - name: Upload native accessibility mutation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-accessibility-mutation-${{ matrix.id }}-${{ github.sha }}
          path: target/native-accessibility-mutants-${{ matrix.id }}.out
          retention-days: 14
          if-no-files-found: error

  native-studio-accessibility-mutation:
    name: native-studio-accessibility-mutation-${{ matrix.id }}
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: 1
            shard: 0/8
          - id: 2
            shard: 1/8
          - id: 3
            shard: 2/8
          - id: 4
            shard: 3/8
          - id: 5
            shard: 4/8
          - id: 6
            shard: 5/8
          - id: 7
            shard: 6/8
          - id: 8
            shard: 7/8
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      ALPINE_PRESENTATION_EVIDENCE_MODE: hosted-direct
      RUSTFLAGS: --cfg alpine_native_validation
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install native mutation tooling
        run: cargo install --locked cargo-mutants --version 27.1.0
      - name: Install the optional Metal toolchain when absent
        run: |
          if ! xcrun --sdk macosx --find metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk macosx --find metal
          xcrun --sdk macosx --find metallib
      - name: Require exhaustive Studio accessibility process mutants to be killed
        run: |
          mkdir -p target
          env -u ALPINE_RUST_ANALYZER ALPINE_STUDIO_NATIVE_PROCESS_SCOPE=accessibility cargo mutants --no-config --file apps/alpine-studio/src/native_validation/accessibility_process.rs --test-package alpine-studio --shard "${{ matrix.shard }}" --no-shuffle --output "target/native-studio-accessibility-process-mutants-${{ matrix.id }}.out" -- --locked
          env -u ALPINE_RUST_ANALYZER cargo mutants --no-config --file apps/alpine-studio/src/lib.rs --re 'reset_native_validation_language_evidence|record_native_validation_language_snapshot|record_native_validation_language_publication|record_native_validation_language_submission|record_native_validation_language_observation|native_validation_language_evidence' --shard "${{ matrix.shard }}" --no-shuffle --output "target/native-studio-language-evidence-mutants-${{ matrix.id }}.out" -- --locked
      - name: Upload Studio accessibility process mutation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-studio-accessibility-mutation-${{ matrix.id }}-${{ github.sha }}
          path: |
            target/native-studio-accessibility-process-mutants-${{ matrix.id }}.out
            target/native-studio-language-evidence-mutants-${{ matrix.id }}.out
          retention-days: 14
          if-no-files-found: error
