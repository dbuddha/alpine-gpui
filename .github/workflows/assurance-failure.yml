name: Assurance failure routing

on:
  workflow_run:
    workflows: [CI, Nightly assurance, Weekly assurance]
    branches: [main]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: read
  issues: write

concurrency:
  group: assurance-failure-routing
  cancel-in-progress: false

jobs:
  route:
    name: route-failures
    if: github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out failure-selection policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Create or update deduplicated defects
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: scripts/route-assurance-failures.sh
