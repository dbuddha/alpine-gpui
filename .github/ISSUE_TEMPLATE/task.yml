name: Multi-PR work
description: Work that needs coordination across pull requests
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the problem, reproduction or scope.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Observable acceptance
      description: What behavior or evidence will show this is resolved?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Relevant links and context
      description: Include affected revisions, environment, related PRs or blockers.
