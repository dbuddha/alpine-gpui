name: Capability
description: Define an owner-approved end-to-end outcome before deriving requirements.
title: "[Capability] "
labels:
  - kind:capability
  - release:none
body:
  - type: markdown
    attributes:
      value: Keep this issue at the observable outcome level. The owner approves this capability before requirements become Ready.
  - type: textarea
    id: persona-outcome
    attributes:
      label: Persona and desired outcome
      description: Who benefits, and what complete capability do they need?
    validations:
      required: true
  - type: textarea
    id: origins
    attributes:
      label: Mission, use cases, and case-study findings
      description: Link durable use cases and stable mission or case-study IDs that motivate this outcome.
    validations:
      required: true
  - type: textarea
    id: trigger-preconditions
    attributes:
      label: Trigger and preconditions
      description: What begins the capability, and what must already be true?
    validations:
      required: true
  - type: textarea
    id: primary-path
    attributes:
      label: Primary path
      description: Describe observable steps from trigger to outcome.
    validations:
      required: true
  - type: textarea
    id: alternate-failure
    attributes:
      label: Alternate and failure paths
      description: Describe cancellation, degradation, recovery, cleanup, and terminal failure.
    validations:
      required: true
  - type: textarea
    id: accessibility
    attributes:
      label: Accessibility expectations
      description: State semantics, actions, focus, announcements, and non-pointer operation, or explain why none apply.
    validations:
      required: true
  - type: textarea
    id: performance-memory
    attributes:
      label: Performance and memory expectations
      description: State user-visible latency, idle-work, throughput, allocation, and retained-memory budgets.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Observable acceptance scenarios
      description: Use testable Given, When, Then scenarios and name the evidence class for each.
    validations:
      required: true
  - type: textarea
    id: diagram
    attributes:
      label: Activity, state, or sequence diagram
      description: Required when multiple states, actors, branches, or ownership transitions exist.
      placeholder: |-
        flowchart TD
            start["Trigger"] --> action["Observable action"]
            action --> outcome["Desired outcome"]
      render: mermaid
  - type: textarea
    id: requirements
    attributes:
      label: Derived requirement sub-issues
      description: Link native GitHub sub-issues after creating them, or list the expected split.
    validations:
      required: true
  - type: textarea
    id: qualification
    attributes:
      label: Capability qualification
      description: Name the required end-to-end, native, accessibility, performance, memory, and release evidence.
    validations:
      required: true
