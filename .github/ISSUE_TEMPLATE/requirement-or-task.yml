name: Requirement or technical task
description: Specify testable behavior or a bounded implementation task.
title: "[Requirement] "
labels:
  - kind:requirement
  - release:none
body:
  - type: dropdown
    id: kind
    attributes:
      label: Work kind
      description: Change the issue label to kind:task after submission when this is an implementation task.
      options:
        - Requirement
        - Technical task
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: Parent capability or requirement
      description: Link the direct parent through GitHub native sub-issues.
      placeholder: "#123"
    validations:
      required: true
  - type: textarea
    id: origins
    attributes:
      label: Origins and atomic claims
      description: Link mission IDs, use cases, case-study finding IDs, and exact AEP claim IDs. Tasks inherit these from the parent Requirement.
    validations:
      required: true
  - type: dropdown
    id: claim-type
    attributes:
      label: Claim type
      options:
        - Functional
        - Safety or lifecycle
        - Concurrency
        - Native backend
        - Accessibility
        - Performance
        - Memory
        - Visual
        - Compatibility
        - Repository tooling
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Required observable behavior
      description: State what must be true without prescribing unnecessary implementation detail.
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Acceptance contract
      description: State Given preconditions, When stimulus, Then result, and the deterministic evidence class.
    validations:
      required: true
  - type: checkboxes
    id: platforms
    attributes:
      label: Platform scope
      options:
        - label: Portable contract
        - label: Apple Silicon macOS and Metal
        - label: Linux, Wayland, or Vulkan
        - label: Windows, Win32, or D3D12
        - label: Repository tooling only
    validations:
      required: true
  - type: textarea
    id: failure
    attributes:
      label: Failure behavior
      description: Define errors, recovery, cleanup, and user-visible degradation.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance test or benchmark
      description: Name exact commands, tests, proofs, artifacts, measurements, and qualified hardware when relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Required evidence and formal applicability
      description: Select unit, property, integration, E2E, TLA+, Kani, Loom, Miri, fuzz, mutation, coverage, benchmark, or native evidence. State Kani applicability, TLA+ properties, bounds, commands, and hardware.
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: Explicit non-goals
      description: Bound the work and name adjacent behavior that remains out of scope.
    validations:
      required: true
  - type: textarea
    id: diagram
    attributes:
      label: State or ownership diagram
      description: Include only when multiple states, actors, branches, or ownership transitions need clarification.
      render: mermaid
