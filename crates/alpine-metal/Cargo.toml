[package]
name = "alpine-metal"
version.workspace = true
description = "Alpine-owned Direct Metal renderer and portable frame planning"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true

[features]
default = []
platform-spi = ["objc2-metal/MTLDrawable", "objc2-metal/block2", "objc2-metal/objc2-core-foundation"]

[dependencies]
alpine-core = { path = "../alpine-core", version = "=0.0.0" }
alpine-renderer = { path = "../alpine-renderer", version = "=0.0.0" }
alpine-scene = { path = "../alpine-scene", version = "=0.0.0" }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
block2 = { version = "=0.6.2", default-features = false }
dispatch2 = { version = "=0.3.0", default-features = false, features = ["std", "block2", "objc2"] }
objc2 = { version = "=0.6.4", default-features = false, features = ["std"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSError", "NSObject", "NSString"] }
objc2-metal = { version = "=0.3.2", default-features = false, features = ["std", "dispatch2", "objc2-core-foundation", "MTLAllocation", "MTLBlitCommandEncoder", "MTLBuffer", "MTLCommandBuffer", "MTLCommandEncoder", "MTLCommandQueue", "MTLDevice", "MTLLibrary", "MTLPixelFormat", "MTLRenderCommandEncoder", "MTLRenderPass", "MTLRenderPipeline", "MTLResource", "MTLTexture", "MTLTypes"] }

[lints.rust]
missing_docs = "deny"
unsafe_code = "allow"
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(kani)', 'cfg(alpine_native_validation)'] }

[lints.clippy]
all = "deny"
pedantic = { level = "deny", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
