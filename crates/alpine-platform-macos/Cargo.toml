[package]
name = "alpine-platform-macos"
version.workspace = true
description = "Alpine-owned native macOS window and Metal presentation surface"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true

[dependencies]
alpine-platform = { path = "../alpine-platform", version = "=0.0.0" }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
objc2 = { version = "=0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSGraphics", "NSResponder", "NSView", "NSWindow", "objc2-quartz-core"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSGeometry", "NSObject", "NSRunLoop", "NSString"] }
objc2-metal = { version = "=0.3.2", default-features = false, features = ["std", "MTLDevice", "MTLPixelFormat"] }
objc2-quartz-core = { version = "=0.3.2", default-features = false, features = ["std", "CALayer", "CAMetalLayer", "CAMetalDisplayLink", "objc2-core-foundation", "objc2-metal"] }

[lints.rust]
missing_docs = "deny"
unsafe_code = "allow"
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(kani)'] }

[lints.clippy]
all = "deny"
pedantic = { level = "deny", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"

[[test]]
name = "native_surface"
harness = false
