[package]
name = "alpine-platform-macos"
version.workspace = true
description = "Alpine-owned native macOS window and Metal presentation surface"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true

[dependencies]
alpine-core = { path = "../alpine-core", version = "=0.0.0" }
alpine-metal = { path = "../alpine-metal", version = "=0.0.0", features = ["platform-spi"] }
alpine-platform = { path = "../alpine-platform", version = "=0.0.0" }
alpine-scene = { path = "../alpine-scene", version = "=0.0.0" }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
block2 = { version = "=0.6.2", default-features = false }
dispatch2 = { version = "=0.3.0", default-features = false, features = ["std"] }
objc2 = { version = "=0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSAccessibility", "NSAccessibilityConstants", "NSAccessibilityElement", "NSAccessibilityProtocols", "NSApplication", "NSAttributedString", "NSEvent", "NSGraphics", "NSGraphicsContext", "NSPasteboard", "NSResponder", "NSRunningApplication", "NSScreen", "NSTextInputClient", "NSView", "NSWindow", "objc2-core-foundation", "objc2-core-graphics", "objc2-quartz-core"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["CGColorSpace", "CGEvent", "CGEventTypes"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "block2", "NSArray", "NSAttributedString", "NSDate", "NSGeometry", "NSNotification", "NSObject", "NSRange", "NSRunLoop", "NSString", "NSTimer"] }
objc2-metal = { version = "=0.3.2", default-features = false, features = ["std", "block2", "objc2-core-foundation", "MTLDevice", "MTLDrawable", "MTLPixelFormat", "MTLTexture"] }
objc2-quartz-core = { version = "=0.3.2", default-features = false, features = ["std", "CALayer", "CAMetalLayer", "CAMetalDisplayLink", "objc2-core-foundation", "objc2-core-graphics", "objc2-metal"] }

[lints.rust]
missing_docs = "deny"
unsafe_code = "allow"
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(kani)', 'cfg(alpine_native_validation)'] }

[lints.clippy]
all = "deny"
pedantic = { level = "deny", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"

[[test]]
name = "native_surface"
harness = false

[[test]]
name = "native_initialization"
harness = false

[[test]]
name = "native_presentation"
harness = false

[[test]]
name = "native_surface_epochs"
harness = false

[[test]]
name = "native_color"
harness = false

[[test]]
name = "native_recovery"
harness = false

[[test]]
name = "native_lifecycle"
harness = false

[[test]]
name = "native_runtime"
harness = false

[[test]]
name = "native_input"
harness = false

[[test]]
name = "native_accessibility"
harness = false

[[test]]
name = "native_wake"
harness = false

[[test]]
name = "native_onscreen_sdr"
harness = false

[[test]]
name = "native_idle"
harness = false
