bounds = ["two origins and two extents per axis each cover the complete u8 domain"]
assumptions = ["u8-derived inputs avoid f32 overflow and non-finite arithmetic"]
exclusions = ["negative origins", "arbitrary f32 values", "transforms", "native coordinates"]
