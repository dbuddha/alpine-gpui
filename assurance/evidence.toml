assumptions = ["slot count is a nonzero power of two"]
exclusions = ["hash distribution", "entry ownership", "Vec allocation", "unbounded table sizes"]
companion = "crates/alpine-text-layout/src/embedded_tests.rs#atlas_index_matches_independent_membership_and_lru_model"

