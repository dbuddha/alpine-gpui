claim = "AEP-0139-C01"
kind = "kani"
artifact = "crates/alpine-text/src/proofs.rs#selection_transform_stays_at_or_after_replacement_start"
assertion = "Every bounded selection offset transforms before, to the start of, or after one replacement according to endpoint affinity."
scope = "Compiled pure selection transform for one edit."
bounds = ["complete u8 start, removed, inserted, and offset domains"]
assumptions = ["replacement ranges and UTF-8 boundaries were validated before transformation"]
