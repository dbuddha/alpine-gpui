[[evidence]]
id = "EV-0141-UNIT01A"
claim = "AEP-0141-C01"
kind = "unit"
artifact = "crates/alpine-text-layout/src/embedded_tests.rs#previous_frame_hit_avoids_materialization_and_shaping"
assertion = "A collision-confirmed previous-frame hit returns the same immutable layout and performs no second shaping call."
scope = "One unchanged line across two cache generations."
exclusions = ["CoreText", "concurrent shaping", "renderer publication"]

[[evidence]]
id = "EV-0141-UNIT01B"
claim = "AEP-0141-C01"
kind = "unit"
artifact = "crates/alpine-text-layout/src/embedded_tests.rs#fingerprint_candidate_requires_exact_content_confirmation"
assertion = "Different same-length text is rejected even when the cache candidate is forced to carry the requested fingerprint."
scope = "Exact streaming range comparison after fingerprint admission."
exclusions = ["cryptographic collision resistance", "Ropey internals"]

[[evidence]]
id = "EV-0141-UNIT02"
claim = "AEP-0141-C02"
kind = "unit"
artifact = "crates/alpine-text-layout/src/embedded_tests.rs#visible_mapping_bounds_layout_to_overscan"
assertion = "Viewport mapping admits exactly the visible fixed-height lines plus bounded overscan and rejects an empty document."
scope = "One finite viewport and one hundred-line document."
exclusions = ["variable-height wrapping", "horizontal viewport", "scene emission"]

[[evidence]]
id = "EV-0141-KANI03"
claim = "AEP-0141-C03"
kind = "kani"
artifact = "crates/alpine-text-layout/src/proofs.rs#adjacent_horizontal_rectangles_merge_without_loss"
assertion = "Two horizontally adjacent equal-height free rectangles merge to their exact combined width without moving origin or height."
scope = "Compiled pure free-rectangle coalescing rule."
bounds = ["complete u8 + 1 width and height domains"]
assumptions = ["rectangles are horizontally adjacent and have equal height"]
exclusions = ["vertical merge", "allocator sequences", "Vec allocation", "unbounded u32 geometry"]
companion = "crates/alpine-text-layout/src/embedded_tests.rs#atlas_allocates_on_demand_reuses_evicts_and_drains"

[[evidence]]
id = "EV-0141-UNIT03"
claim = "AEP-0141-C03"
kind = "unit"
artifact = "crates/alpine-text-layout/src/embedded_tests.rs#atlas_allocates_on_demand_reuses_evicts_and_drains"
assertion = "The atlas starts empty, reuses one key, stays below budget, evicts under saturation, and releases all storage under pressure."
scope = "A8 glyphs in one bounded 256-pixel atlas generation."
exclusions = ["native glyph rasterization", "GPU texture residency", "concurrent frames"]

[[evidence]]
id = "EV-0141-UNIT07"
claim = "AEP-0141-C07"
kind = "unit"
artifact = "crates/alpine-text-layout/src/embedded_tests.rs#atlas_index_matches_independent_membership_and_lru_model"
assertion = "A deterministic mixed-operation model preserves indexed membership, exact use ordering, collision reachability, swap-removal, pressure release, and metadata accounting against an independent bounded reference."
scope = "Two thousand forty-eight insert, lookup, eviction, and pressure operations across 64 glyph keys."
exclusions = ["native rasterization", "hash-distribution benchmark", "concurrent atlas mutation", "GPU publication"]

[[evidence]]
id = "EV-0141-KANI07"
claim = "AEP-0141-C07"
kind = "kani"
artifact = "crates/alpine-text-layout/src/proofs.rs#power_of_two_probe_never_escapes_the_index"
assertion = "Every bounded start and probe maps inside its nonzero power-of-two index table."
scope = "Compiled pure probe arithmetic for power-of-two tables through 128 slots."
bounds = ["complete u8 start and probe domains", "table exponents zero through seven"]
assumptions = ["slot count is a nonzero power of two"]
exclusions = ["hash distribution", "entry ownership", "Vec allocation", "unbounded table sizes"]
companion = "crates/alpine-text-layout/src/embedded_tests.rs#atlas_index_matches_independent_membership_and_lru_model"

[[evidence]]
id = "EV-0141-UNIT08A"
claim = "AEP-0141-C08"
kind = "unit"
artifact = "crates/alpine-text-layout/src/lib.rs#publication_is_revision_bound_and_acknowledgement_is_stale_safe"
assertion = "A matching consumer receives exact complete-row bytes, while stale acknowledgement cannot discard the same pending mutation."
scope = "One four-by-four atlas mutation and one revision-safe acknowledgement sequence."
exclusions = ["scene publication", "GPU upload", "concurrent mutation"]

[[evidence]]
id = "EV-0141-UNIT08B"
claim = "AEP-0141-C08"
kind = "unit"
artifact = "crates/alpine-text-layout/src/lib.rs#dirty_ranges_coalesce_and_never_exceed_the_fixed_bound"
assertion = "Adjacent ranges coalesce and 65 disjoint insertions retain no more than 64 sorted disjoint ranges."
scope = "The production 64-range capacity, including its deterministic saturation path."
exclusions = ["pixel copying", "scene publication", "GPU upload"]

[[evidence]]
id = "EV-0141-KANI08A"
claim = "AEP-0141-C08"
kind = "kani"
artifact = "crates/alpine-text-layout/src/proofs.rs#dirty_row_small_actions_preserve_sorted_disjoint_storage"
assertion = "Three arbitrary bounded row mutations preserve capacity, sorted order, nonempty ranges, and disjointness."
scope = "Compiled production transition logic with capacity three and starts zero through seven."
bounds = ["three actions", "three retained ranges", "one through four rows per action"]
assumptions = ["one synchronous atlas owner"]
exclusions = ["production capacity 64", "allocation", "GPU upload"]
companion = "crates/alpine-text-layout/src/lib.rs#dirty_ranges_coalesce_and_never_exceed_the_fixed_bound"

[[evidence]]
id = "EV-0141-KANI08B"
claim = "AEP-0141-C08"
kind = "kani"
artifact = "crates/alpine-text-layout/src/proofs.rs#dirty_row_capacity_merge_remains_bounded"
assertion = "One arbitrary insertion into a full three-range set remains bounded and preserves sorted disjoint output."
scope = "Compiled production saturation logic with both capacity-preserving and overlap-reduction covers."
bounds = ["three retained ranges", "one arbitrary insertion", "starts zero through fifteen"]
assumptions = ["one synchronous atlas owner"]
exclusions = ["production capacity 64", "allocation", "GPU upload"]
companion = "crates/alpine-text-layout/src/lib.rs#dirty_ranges_coalesce_and_never_exceed_the_fixed_bound"

[[evidence]]
id = "EV-0141-UNIT09A"
claim = "AEP-0141-C09"
kind = "unit"
artifact = "crates/alpine-scene/src/lib.rs#atlas_row_patches_share_the_base_and_override_exact_pixels"
assertion = "A revised immutable atlas shares its full base while exact row overrides change only current sampled pixels."
scope = "One three-by-three base, one complete-row override, and direct base/current pixel comparisons."
exclusions = ["native upload", "concurrent scene consumption", "device recovery"]

[[evidence]]
id = "EV-0141-UNIT09B"
claim = "AEP-0141-C09"
kind = "unit"
artifact = "apps/alpine-editor/src/editor_coverage_tests.rs#atlas_row_publication_retains_the_full_base_and_acknowledges_the_delta"
assertion = "A second glyph admission retains the first full base, publishes fewer row bytes than the complete atlas, and advances the acknowledged source revision."
scope = "Two distinct glyph admissions through Studio's production atlas publication path."
exclusions = ["native upload", "typing latency", "atlas growth"]

[[evidence]]
id = "EV-0141-UNIT09C"
claim = "AEP-0141-C09"
kind = "unit"
artifact = "crates/alpine-scene/src/lib.rs#atlas_row_patch_limit_resynchronizes_one_full_base_and_resumes_deltas"
assertion = "A sixty-fifth disjoint recovery row materializes one current full base, clears cumulative metadata, and the following revision resumes one shared-base row delta."
scope = "Exact sixty-four-patch boundary, one rollover row, current-pixel preservation, storage replacement, and one subsequent delta."
exclusions = ["native upload", "allocation injection", "fixed-hardware latency"]

[[evidence]]
id = "EV-0141-NATIVE09A"
claim = "AEP-0141-C09"
kind = "native"
artifact = "crates/alpine-metal/src/native.rs#renders_a8_glyphs_and_reuses_only_identical_atlas_storage"
assertion = "A compatible row revision uploads three bytes into the retained six-byte private atlas without increasing private allocation count, and output matches the CPU oracle."
scope = "One full upload, 33 exact reuses, one half-image row update, and one incompatible full replacement on Apple Silicon."
exclusions = ["fixed-hardware latency", "device loss", "multi-range presentation"]

[[evidence]]
id = "EV-0141-UNIT04"
claim = "AEP-0141-C04"
kind = "unit"
artifact = "crates/alpine-metal/src/frame.rs#glyph_clipping_crops_destination_and_atlas_uv_together"
assertion = "Clipping a glyph crops its physical destination and normalized atlas coordinates by the same ratios."
scope = "One clipped A8 glyph lowered through the portable Metal frame plan."
exclusions = ["native texture sampling", "subpixel filtering", "color glyphs"]

[[evidence]]
id = "EV-0141-UNIT04B"
claim = "AEP-0141-C04"
kind = "unit"
artifact = "crates/alpine-metal/src/frame.rs#glyph_atlas_contract_bounds_native_admission"
assertion = "The frame plan accepts the exact 16 MiB payload boundary and rejects oversized dimensions or payloads before native work."
scope = "Pure renderer admission at the Metal 3 extent and Alpine A8 byte ceilings."
exclusions = ["native allocation success", "system-wide memory pressure", "color textures"]

[[evidence]]
id = "EV-0141-NATIVE04A"
claim = "AEP-0141-C04"
kind = "native"
artifact = "crates/alpine-metal/src/native.rs#renders_a8_glyphs_and_reuses_only_identical_atlas_storage"
assertion = "Metal output matches the CPU oracle for zero, partial, and full A8 coverage; repeated identical storage performs no atlas upload; same-revision replacement storage uploads once."
scope = "Apple Silicon native offscreen rendering and a 32-frame steady-state reuse sequence."
exclusions = ["fixed-hardware latency", "CoreText shaping", "product-level scrolling"]

[[evidence]]
id = "EV-0141-NATIVE04B"
claim = "AEP-0141-C04"
kind = "native"
artifact = "crates/alpine-metal/src/native.rs#atlas_pressure_release_preserves_in_flight_drawable_ownership"
assertion = "Pressure drops the cached atlas while one presentation slot remains occupied; the retained command completes and a later frame creates exactly one replacement texture."
scope = "One split-phase drawable, one pressure event, and one replacement submission on Apple Silicon."
exclusions = ["device loss", "process memory pressure notification delivery", "multi-window presentation"]

