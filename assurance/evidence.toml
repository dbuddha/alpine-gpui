[[evidence]]
id = "EV-0016-TLA01"
claim = "AEP-0016-C01"
kind = "tla"
artifact = "formal/tla/aep-0016/PortableValues.tla#AcceptedIsValid"
assertion = "The finite constructor model never admits a scalar outside its valid interval."
scope = "Integer abstraction of size admission."
bounds = ["pull request: raw model values 0 through 3, valid 1 through 2", "nightly: raw model values 0 through 6, valid 2 through 4"]
assumptions = ["integer validity represents the sign and range admission predicate"]
exclusions = ["IEEE-754 encoding", "multi-field correlation", "Rust conformance beyond companion tests"]
companion = "crates/alpine-core/src/lib.rs#bounded_size_constructor_companion"

[[evidence]]
id = "EV-0016-KANI01"
claim = "AEP-0016-C01"
kind = "kani"
artifact = "crates/alpine-core/src/proofs.rs#bounded_sizes_preserve_constructor_contract"
assertion = "Every u16-derived width and height is accepted, preserved, and classified empty exactly at zero."
scope = "Compiled Rust Size constructor and is_empty implementation."
bounds = ["width and height each cover the complete u16 domain"]
assumptions = ["u16 to f32 conversion is exact for the domain"]
exclusions = ["negative values", "non-finite values", "values above u16::MAX", "timing and allocation"]
companion = "crates/alpine-core/src/lib.rs#bounded_size_constructor_companion"

[[evidence]]
id = "EV-0016-UNIT01"
claim = "AEP-0016-C01"
kind = "unit"
artifact = "crates/alpine-core/src/lib.rs#bounded_size_constructor_companion"
assertion = "Representative zero, one, and maximum bounded sizes replay the proof contract dynamically."
scope = "Executable Rust test cases."
exclusions = ["Exhaustive input coverage"]

[[evidence]]
id = "EV-0016-TLA02"
claim = "AEP-0016-C02"
kind = "tla"
artifact = "formal/tla/aep-0016/PortableValues.tla#AcceptedIsValid"
assertion = "The finite constructor model admits only values inside its normalized interval."
scope = "Integer abstraction of normalized color admission."
bounds = ["pull request: valid model values 1 through 2", "nightly: valid model values 2 through 4"]
assumptions = ["finite interval membership represents normalized channel validation"]
exclusions = ["division rounding", "four-channel correlation", "color-space semantics"]
companion = "crates/alpine-core/src/lib.rs#byte_color_constructor_companion"

[[evidence]]
