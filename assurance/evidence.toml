assertion = "The frame plan accepts the exact 16 MiB payload boundary and rejects oversized dimensions or payloads before native work."
scope = "Pure renderer admission at the Metal 3 extent and Alpine A8 byte ceilings."
exclusions = ["native allocation success", "system-wide memory pressure", "color textures"]

[[evidence]]
id = "EV-0141-NATIVE04A"
claim = "AEP-0141-C04"
kind = "native"
artifact = "crates/alpine-metal/src/native.rs#renders_a8_glyphs_and_reuses_only_identical_atlas_storage"
assertion = "Metal output matches the CPU oracle for zero, partial, and full A8 coverage; repeated identical storage performs no atlas upload; same-revision replacement storage uploads once."
scope = "Apple Silicon native offscreen rendering and a 32-frame steady-state reuse sequence."
exclusions = ["fixed-hardware latency", "CoreText shaping", "product-level scrolling"]

[[evidence]]
id = "EV-0141-NATIVE04B"
claim = "AEP-0141-C04"
kind = "native"
artifact = "crates/alpine-metal/src/native.rs#atlas_pressure_release_preserves_in_flight_drawable_ownership"
assertion = "Pressure drops the cached atlas while one presentation slot remains occupied; the retained command completes and a later frame creates exactly one replacement texture."
scope = "One split-phase drawable, one pressure event, and one replacement submission on Apple Silicon."
exclusions = ["device loss", "process memory pressure notification delivery", "multi-window presentation"]

