[[evidence]]
id = "EV-0009-TLA01"
claim = "AEP-0009-C01"
kind = "tla"
artifact = "formal/tla/aep-0009/AssuranceLifecycle.tla#QualifiedClosure"
assertion = "A closed Requirement has approval, implementation, and every required evidence kind."
scope = "Finite monotonic workflow with the configured Requirement and evidence-kind sets."
bounds = ["pull request: 2 Requirements by 2 kinds", "nightly: 3 Requirements by 3 kinds"]
assumptions = ["evidence-kind membership represents an independently passing qualified check", "weak fairness for enabled workflow progress"]
exclusions = ["GitHub API failures", "semantic validity of a test or proof", "validator implementation defects"]
companion = "tools/alpine-assurance/src/main.rs#validate_registry"

