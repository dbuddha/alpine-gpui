assertion = "A deterministic mixed-operation model preserves indexed membership, exact use ordering, collision reachability, swap-removal, pressure release, and metadata accounting against an independent bounded reference."
scope = "Two thousand forty-eight insert, lookup, eviction, and pressure operations across 64 glyph keys."
exclusions = ["native rasterization", "hash-distribution benchmark", "concurrent atlas mutation", "GPU publication"]

[[evidence]]
