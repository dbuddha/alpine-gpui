[[evidence]]
id = "EV-0139-UNIT01"
claim = "AEP-0139-C01"
kind = "unit"
artifact = "crates/alpine-text/src/lib.rs#snapshots_remain_immutable_and_rejected_edits_are_atomic"
assertion = "A valid Unicode replacement leaves its prior snapshot immutable, while invalid and stale transactions preserve current state."
scope = "Public local Buffer and Transaction API."
exclusions = ["native input", "concurrent writers"]

[[evidence]]
id = "EV-0139-PROPERTY01"
claim = "AEP-0139-C01"
kind = "property"
artifact = "crates/alpine-text/src/lib.rs#random_edits_match_an_independent_string_oracle"
assertion = "One thousand deterministic random UTF-8 replacements match an independent String oracle after every accepted edit."
scope = "Unicode, CRLF, LF, insertion, deletion, and replacement sequences."
bounds = ["1,000 edits", "five replacement classes"]
exclusions = ["all possible Unicode strings", "concurrent edits"]

[[evidence]]
id = "EV-0139-UNIT02"
claim = "AEP-0139-C02"
kind = "unit"
artifact = "crates/alpine-text/src/lib.rs#undo_redo_are_bounded_and_revisions_never_move_backward"
assertion = "Entry and changed-byte ceilings evict oldest history while undo and redo preserve text and monotonic revisions."
scope = "Public Buffer history API with two entries and two changed bytes."
exclusions = ["process footprint", "allocator instrumentation"]

[[evidence]]
id = "EV-0139-INTEGRATION03A"
claim = "AEP-0139-C03"
kind = "integration"
artifact = "crates/alpine-text/src/lib.rs#editor_saves_atomically_and_detects_external_change"
assertion = "A real local file is atomically replaced, then an external write is detected and preserved instead of overwritten."
scope = "One same-directory UTF-8 file on the Unix platform family."
assumptions = ["same-directory rename is atomic on the v1 filesystem"]
exclusions = ["Windows replacement", "network filesystems", "malicious concurrent rename in the final comparison interval"]

[[evidence]]
id = "EV-0139-INTEGRATION03B"
claim = "AEP-0139-C03"
kind = "integration"
artifact = "crates/alpine-text/src/lib.rs#injected_write_failure_preserves_target_and_cleans_temporary_file"
assertion = "An injected pre-replacement write failure preserves accepted target bytes and removes the temporary file."
scope = "Same-directory temporary-file replacement helper."
exclusions = ["power loss after rename", "parent-directory synchronization", "Windows replacement"]

